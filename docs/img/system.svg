<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="System architecture: browsers reach one Verda CPU server over HTTPS through Caddy; a Flask app under gunicorn serves the pages and JSON API, embeds questions with bge-m3 and translates with Opus-MT on the CPU, reads MariaDB on localhost and calls the Anthropic API for answers. Offline, Modal GPUs embed the passages from the datasets and loaders fill MariaDB.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="609" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#111827">System architecture</text>

  <!-- users -->
  <rect x="30" y="92" width="160" height="66" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="110" y="119" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Browser</text>
  <text x="110" y="140" font-size="12" fill="#4b5563" text-anchor="middle">readers and editors</text>
  <rect x="30" y="440" width="160" height="70" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="110" y="468" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Team laptops</text>
  <text x="110" y="489" font-size="12" fill="#4b5563" text-anchor="middle">own database logins</text>

  <!-- server -->
  <rect x="220" y="56" width="480" height="530" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="80" font-size="13" font-weight="700" fill="#334155">Verda CPU server <tspan font-weight="400">· 4 vCPU, 16 GB · Helsinki · ~€1.50 a day</tspan></text>

  <rect x="240" y="96" width="440" height="56" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="256" y="120" font-size="15" font-weight="700" fill="#111827">Caddy</text>
  <text x="256" y="140" font-size="12" fill="#4b5563">HTTPS with a Let's Encrypt certificate · the only public port</text>

  <rect x="240" y="180" width="440" height="222" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="256" y="204" font-size="15" font-weight="700" fill="#111827">Flask app <tspan font-weight="400" font-size="12.5" fill="#4b5563">· gunicorn, 1 worker, 8 threads</tspan></text>
  <g font-size="12" fill="#374151">
    <text x="256" y="228"><tspan font-weight="700">Pages:</tspan> Ask · Article history · Compare · Graph · Drift · Editor tools</text>
    <text x="256" y="250"><tspan font-weight="700">JSON API:</tspan> /ask · /article · /api/graph · /api/xlang · /api/health</text>
    <text x="256" y="268">/api/rewind · /api/cite · /api/radar · /api/explain · /api/translate</text>
  </g>
  <rect x="256" y="284" width="200" height="66" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="268" y="306" font-size="13.5" font-weight="700" fill="#111827">bge-m3</text>
  <text x="268" y="325" font-size="12" fill="#4b5563">embeds each question</text>
  <text x="268" y="342" font-size="12" fill="#4b5563">on the CPU · ~2.3 GB</text>
  <rect x="466" y="284" width="198" height="66" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="478" y="306" font-size="13.5" font-weight="700" fill="#111827">Opus-MT</text>
  <text x="478" y="325" font-size="12" fill="#4b5563">fi ↔ en/sv translation</text>
  <text x="478" y="342" font-size="12" fill="#4b5563">on the CPU · no API, no key</text>
  <text x="256" y="378" font-size="12" fill="#4b5563"><tspan font-weight="700" fill="#374151">Caps on model calls:</tspan> 20 per visitor an hour · 300 a day</text>

  <rect x="240" y="428" width="440" height="140" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="256" y="452" font-size="15" font-weight="700" fill="#115e59">MariaDB 12 <tspan font-weight="400" font-size="12.5">· Docker · listens on 127.0.0.1 only</tspan></text>
  <g font-size="12" fill="#374151">
    <text x="256" y="476">article: 862k versions, system-versioned, real edit times</text>
    <text x="256" y="496">passages + vectors 66.5k · history 593k lifetimes, 353k vectors</text>
    <text x="256" y="516">S article vectors 29.5k · en/sv paragraphs 35.8k · reverts 46k</text>
    <text x="256" y="536">L: 1.5M passages, 982k vectors (the scale test)</text>
    <text x="256" y="556">vector indexes HNSW M=16, ef_search 80 · FULLTEXT</text>
  </g>

  <!-- outside -->
  <rect x="740" y="190" width="190" height="96" rx="10" fill="#fdf1ec" stroke="#d97757" stroke-width="1.5"/>
  <text x="835" y="215" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Anthropic API</text>
  <text x="835" y="236" font-size="12" fill="#4b5563" text-anchor="middle">Claude Opus 5.5 writes</text>
  <text x="835" y="254" font-size="12" fill="#4b5563" text-anchor="middle">cited answers, edit summaries</text>
  <text x="835" y="272" font-size="12" fill="#4b5563" text-anchor="middle">~$0.03 an answer</text>

  <text x="740" y="398" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1.2">OFFLINE, ONCE</text>
  <rect x="740" y="406" width="190" height="74" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="835" y="430" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Modal GPUs</text>
  <text x="835" y="450" font-size="12" fill="#4b5563" text-anchor="middle">bge-m3 over every passage</text>
  <text x="835" y="468" font-size="12" fill="#4b5563" text-anchor="middle">66k in 6 min · 1.5M in ~1 h</text>
  <rect x="740" y="512" width="190" height="62" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="835" y="537" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Datasets S · M · L</text>
  <text x="835" y="557" font-size="12" fill="#4b5563" text-anchor="middle">MariaDB Wikipedia, Parquet</text>

  <!-- arrows -->
  <g fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)">
    <path d="M190 124H238"/>
    <path d="M460 152V178"/>
    <path d="M460 402V426"/>
    <path d="M680 238H738"/>
    <path d="M835 512V482"/>
    <path d="M740 443H682"/>
    <path d="M740 543H682"/>
  </g>
  <path d="M190 475H238" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <g font-size="11.5" fill="#4b5563">
    <text x="214" y="116" text-anchor="middle">HTTPS</text>
    <text x="468" y="170">to 127.0.0.1:5000</text>
    <text x="468" y="420">SQL · one statement per search</text>
    <text x="709" y="230" text-anchor="middle">passages</text>
    <text x="709" y="256" text-anchor="middle">answer</text>
    <text x="843" y="500">text</text>
    <text x="711" y="436" text-anchor="middle">vectors</text>
    <text x="711" y="536" text-anchor="middle">loaders</text>
    <text x="214" y="467" text-anchor="middle">SSH</text>
  </g>
</svg>
