<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1380" width="960" height="1380" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="How Kerros finds and answers. Built once: datasets M and S are split into one passage per section and embedded once per distinct text with bge-m3; S's whole-article vectors and Wikidata links are loaded as shipped. Per question: the question becomes a vector, keyword terms and an optional date; one MariaDB statement runs five ranked lists over those tables and fuses them by reciprocal rank fusion; dated questions read the paragraphs live on that date with FOR SYSTEM_TIME AS OF. Claude writes one cited sentence per line, checked in code.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="1379" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#111827">How Kerros finds and answers</text>
  <g font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1.2">
    <text x="30" y="58">BUILT ONCE, OFFLINE</text>
    <text x="690" y="58">PER QUESTION</text>
  </g>

  <!-- ===== built once ===== -->
  <rect x="30" y="66" width="270" height="62" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="165" y="91" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Dataset M</text>
  <text x="165" y="112" font-size="12" fill="#4b5563" text-anchor="middle">every version · 862k of 19.7k articles</text>
  <rect x="330" y="66" width="270" height="62" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="465" y="91" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Dataset S</text>
  <text x="465" y="112" font-size="12" fill="#4b5563" text-anchor="middle">today's fi / sv / en articles + vectors</text>

  <g fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)">
    <path d="M165 128V168"/><path d="M400 128V168"/>
  </g>
  <g font-size="12" fill="#4b5563">
    <text x="173" y="153">newest + every version</text>
    <text x="408" y="153">en/sv text</text>
    <text x="590" y="153">as shipped</text>
  </g>

  <rect x="30" y="170" width="530" height="196" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="46" y="194" font-size="15" font-weight="700" fill="#111827">Split: one passage per section</text>
  <rect x="46" y="206" width="130" height="146" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="56" y="225" font-size="12.5" font-weight="700" fill="#111827">Talvisota</text>
  <rect x="56" y="232" width="110" height="18" rx="3" fill="#dbeafe"/>
  <text x="61" y="245" font-size="10.5" fill="#1e3a8a">lead</text>
  <text x="56" y="267" font-size="10.5" fill="#6b7280">== Tausta ==</text>
  <rect x="56" y="272" width="110" height="16" rx="3" fill="#dcfce7"/>
  <text x="56" y="305" font-size="10.5" fill="#6b7280">== Sodan kulku ==</text>
  <rect x="56" y="310" width="110" height="34" rx="3" fill="#fef3c7"/>
  <path d="M56 327H166" stroke="#b45309" stroke-dasharray="4 3"/>
  <text x="161" y="323" font-size="10" fill="#92400e" text-anchor="end">620 words</text>
  <path d="M176 279H210" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="11.5" fill="#111827">
    <rect x="214" y="208" width="152" height="28" rx="5" fill="#dbeafe"/><text x="222" y="226">1 · lead</text>
    <rect x="214" y="242" width="152" height="28" rx="5" fill="#dcfce7"/><text x="222" y="260">2 · Tausta</text>
    <rect x="214" y="276" width="152" height="28" rx="5" fill="#fef3c7"/><text x="222" y="294">3 · Sodan kulku, part 1</text>
    <rect x="214" y="310" width="152" height="28" rx="5" fill="#fef3c7"/><text x="222" y="328">4 · Sodan kulku, part 2</text>
  </g>
  <g font-size="11.5" fill="#374151">
    <text x="382" y="222">• lead = its own passage</text>
    <text x="382" y="242">• one passage per section</text>
    <text x="382" y="262">• long sections split at</text>
    <text x="392" y="280">paragraphs (~300 words)</text>
    <text x="382" y="300">• no overlap</text>
    <text x="382" y="320">• old versions: same split,</text>
    <text x="392" y="338">same text → same hash</text>
  </g>

  <path d="M295 366V392" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="30" y="394" width="530" height="74" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="295" y="418" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Embed: bge-m3 on Modal GPUs</text>
  <text x="295" y="439" font-size="12" fill="#4b5563" text-anchor="middle">input = title ↵ heading ↵ text · text_hash = SHA-256 of it</text>
  <text x="295" y="457" font-size="12" fill="#4b5563" text-anchor="middle">same hash, same vector: 862k versions → 353k vectors</text>

  <!-- ===== per question ===== -->
  <rect x="690" y="66" width="250" height="62" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="815" y="91" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Question</text>
  <text x="815" y="112" font-size="12" fill="#4b5563" text-anchor="middle">Finnish, Swedish or English</text>
  <path d="M815 128V168" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="690" y="170" width="250" height="78" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="815" y="194" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Embed + keyword terms</text>
  <text x="815" y="215" font-size="12" fill="#4b5563" text-anchor="middle">bge-m3 vector (same model)</text>
  <text x="815" y="234" font-size="12" fill="#4b5563" text-anchor="middle">names, years: Kekkonen → Kekko*</text>
  <path d="M815 248V288" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="690" y="290" width="250" height="78" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="815" y="314" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">A date in it?</text>
  <text x="815" y="335" font-size="12" fill="#4b5563" text-anchor="middle">“…in 2007, what has changed?”</text>
  <text x="815" y="354" font-size="12" fill="#4b5563" text-anchor="middle">the date becomes a filter, not text</text>

  <!-- ===== MariaDB ===== -->
  <rect x="20" y="508" width="920" height="472" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="40" y="535" font-size="15" font-weight="700" fill="#115e59">MariaDB <tspan font-weight="400">· tables built once, read by one SQL statement per question</tspan></text>

  <g fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)">
    <path d="M295 468V506"/>
    <path d="M582 128V506"/>
    <path d="M815 368V552H430V570"/>
  </g>
  <text x="303" y="492" font-size="12" fill="#4b5563">embedded once</text>
  <text x="807" y="420" font-size="12" font-weight="600" fill="#115e59" text-anchor="end">vector + terms + date</text>

  <g font-size="12" fill="#4b5563">
    <!-- tables -->
    <g font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#111827">
      <rect x="40" y="572" width="240" height="52" rx="8" fill="#ffffff" stroke="#99f6e4"/><text x="52" y="593">passage_vector</text>
      <rect x="40" y="634" width="240" height="52" rx="8" fill="#ffffff" stroke="#99f6e4"/><text x="52" y="655">passage</text>
      <rect x="40" y="696" width="240" height="52" rx="8" fill="#ffffff" stroke="#99f6e4"/><text x="52" y="717">article_vector fi</text>
      <rect x="40" y="758" width="240" height="52" rx="8" fill="#ffffff" stroke="#99f6e4"/><text x="52" y="779">article_vector sv/en</text>
      <rect x="40" y="820" width="240" height="52" rx="8" fill="#ffffff" stroke="#99f6e4"/><text x="52" y="841">article_langlink</text>
      <rect x="40" y="902" width="240" height="52" rx="8" fill="#ffffff" stroke="#99f6e4"/><text x="52" y="923">passage_history</text>
    </g>
    <text x="52" y="613">66.5k · HNSW index, M=16</text>
    <text x="52" y="675">today's text · FULLTEXT</text>
    <text x="52" y="737">19.3k whole articles</text>
    <text x="52" y="799">→ Finnish by Wikidata id</text>
    <text x="52" y="861">10.2k en/sv titles</text>
    <text x="52" y="943">+ history_vector · 593k lifetimes</text>
    <g font-size="10.5" fill="#6b7280" text-anchor="end">
      <text x="270" y="593">from M</text><text x="270" y="655">from M</text><text x="270" y="717">from S</text>
      <text x="270" y="779">from S</text><text x="270" y="841">from S</text><text x="270" y="923">M, all versions</text>
    </g>

    <!-- lists -->
    <rect x="300" y="572" width="260" height="52" rx="8" fill="#ffffff" stroke="#14b8a6"/>
    <rect x="300" y="634" width="260" height="52" rx="8" fill="#ffffff" stroke="#14b8a6"/>
    <rect x="300" y="696" width="260" height="52" rx="8" fill="#ffffff" stroke="#14b8a6"/>
    <rect x="300" y="758" width="260" height="52" rx="8" fill="#ffffff" stroke="#14b8a6"/>
    <rect x="300" y="820" width="260" height="52" rx="8" fill="#ffffff" stroke="#14b8a6"/>
    <rect x="300" y="902" width="260" height="52" rx="8" fill="#ffffff" stroke="#14b8a6"/>
    <circle cx="316" cy="598" r="5.5" fill="#2563eb"/><circle cx="316" cy="660" r="5.5" fill="#b45309"/>
    <circle cx="316" cy="722" r="5.5" fill="#2563eb"/><circle cx="316" cy="784" r="5.5" fill="#2563eb"/>
    <circle cx="316" cy="846" r="5.5" fill="#b45309"/><circle cx="316" cy="928" r="5.5" fill="#2563eb"/>
    <g font-size="13.5" font-weight="700" fill="#111827">
      <text x="330" y="593">Nearest passages</text><text x="330" y="655">Names and years</text>
      <text x="330" y="717">Nearest articles</text><text x="330" y="779">Nearest en/sv articles</text>
      <text x="330" y="841">Title named in the question</text><text x="330" y="923">Passages live on that date</text>
    </g>
    <text x="330" y="613">top 50 by vector distance</text>
    <text x="330" y="675">prefix search, top 50</text>
    <text x="330" y="737">→ the article's lead passage</text>
    <text x="330" y="799">→ the Finnish article's lead</text>
    <text x="330" y="861">→ that Finnish article's lead</text>
    <text x="330" y="943" font-family="Consolas, Menlo, monospace" font-size="11.5">FOR SYSTEM_TIME AS OF date</text>
    <text x="300" y="893" font-size="11" fill="#6b7280">dated questions only</text>
  </g>

  <g fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)">
    <path d="M280 598H298"/><path d="M280 660H298"/><path d="M280 722H298"/><path d="M280 784H298"/><path d="M280 846H298"/><path d="M280 928H298"/>
    <path d="M560 598H578"/><path d="M560 660H578"/><path d="M560 722H578"/><path d="M560 784H578"/><path d="M560 846H578"/>
  </g>
  <rect x="580" y="572" width="100" height="300" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="630" y="696" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">RRF</text>
  <g font-size="11.5" fill="#4b5563" text-anchor="middle">
    <text x="630" y="718">UNION ALL</text><text x="630" y="736">+ GROUP BY</text><text x="630" y="754">Σ 1/(60+rank)</text>
  </g>

  <g font-size="12" fill="#115e59">
    <text x="710" y="610">Five ranked lists and their</text>
    <text x="710" y="628">fusion are one SQL statement:</text>
    <text x="710" y="646">~25 ms median over 66k passages.</text>
    <text x="710" y="682">Vector and keyword search share</text>
    <text x="710" y="700">the same tables, so no second</text>
    <text x="710" y="718">search engine to keep in sync.</text>
    <text x="710" y="918">Time is a filter on the table,</text>
    <text x="710" y="936">never part of the vector.</text>
  </g>

  <!-- ===== answer ===== -->
  <g fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)">
    <path d="M630 872V994H720V1012"/>
    <path d="M430 954V1012"/>
    <path d="M720 1070V1108"/>
    <path d="M430 1070V1108"/>
    <path d="M515 1172V1204"/>
    <path d="M515 1262V1294"/>
  </g>
  <rect x="580" y="1014" width="280" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="720" y="1037" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Top 8 passages</text>
  <text x="720" y="1057" font-size="12" fill="#4b5563" text-anchor="middle">≤ 2 per article · each keeps its rev_id</text>
  <rect x="300" y="1014" width="260" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="430" y="1037" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Today's counterpart</text>
  <text x="430" y="1057" font-size="12" fill="#4b5563" text-anchor="middle">same article, by meaning · word diff</text>

  <rect x="170" y="1110" width="690" height="62" rx="10" fill="#fdf1ec" stroke="#d97757" stroke-width="1.5"/>
  <text x="515" y="1135" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Claude Opus 5.5 writes the answer</text>
  <text x="515" y="1156" font-size="12" fill="#4b5563" text-anchor="middle">one sentence per line, each ending in [n] · only facts in the passages · then vs now when dated</text>

  <rect x="270" y="1206" width="490" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="515" y="1229" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Checked in code</text>
  <text x="515" y="1249" font-size="12" fill="#4b5563" text-anchor="middle">unknown [n] dropped · uncited sentences marked · cited sources first</text>

  <rect x="270" y="1296" width="490" height="60" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="515" y="1320" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Cited answer</text>
  <text x="515" y="1341" font-size="12" fill="#4b5563" text-anchor="middle">each sentence → its paragraph → the exact revision (?oldid=)</text>
</svg>
